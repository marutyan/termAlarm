<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; display: flex;">

  <div style="width: 54px; flex-shrink: 0; border-right: 1px solid #1E3163; display: flex; flex-direction: column; align-items: center; padding: 56px 0 26px; gap: 26px;">
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#55709E" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg>
    </div>
    <div style="width: 34px; height: 34px; border-radius: 3px; background: #8CDDC2; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1530" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#55709E" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#55709E" stroke-width="1.6" stroke-linecap="round"><path d="M12 13V8M9 3h6M5 13a7 7 0 1014 0 7 7 0 00-14 0z"/></svg>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#55709E" stroke-width="1.6" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19h-20"/></svg>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#55709E" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 52px 18px 0; display: flex; flex-direction: column; gap: 14px;">

    <div style="font-size: 28px; font-weight: 300; letter-spacing: -0.01em;">記録</div>

    <div style="display: flex; gap: 6px;">
      <div style="flex-grow: 1; height: 42px; display: flex; align-items: center; justify-content: center; background: #123A3C; border: 1px solid #2E5A57; border-radius: 3px; font-size: 13px; color: #8CDDC2;">直近7日</div>
      <div style="flex-grow: 1; height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid #1E3163; border-radius: 3px; font-size: 13px; color: #7B93BF;">直近30日</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;">
      <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 9px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">平均</div>
        <div style="font-size: 25px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">6.2</div>
        <div style="font-size: 10px; color: #55709E;">回目で起床</div>
      </div>
      <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 9px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">平均</div>
        <div style="font-size: 25px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">31<span style="font-size: 12px; color: #7B93BF;">分</span></div>
        <div style="font-size: 10px; color: #55709E;">開始から</div>
      </div>
      <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 9px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">長押し</div>
        <div style="font-size: 25px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; color: #FEE48F;">18<span style="font-size: 12px; color: #7B93BF;">%</span></div>
        <div style="font-size: 10px; color: #55709E;">で緊急停止</div>
      </div>
    </div>

    <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 14px 15px 12px; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 9.5px; letter-spacing: 0.12em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">何回目で起きたか</div>
      <div style="display: flex; align-items: flex-end; gap: 7px; height: 84px;">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="7">
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div style="font-size: 9px; color: #55709E; font-family: 'IBM Plex Mono', monospace;">{{bar.value}}</div>
            <div style="width: 100%; height: {{bar.h}}; background: {{bar.color}}; border-radius: 1px;"></div>
            <div style="font-size: 9px; color: #55709E; font-family: 'IBM Plex Mono', monospace;">{{bar.day}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 9.5px; letter-spacing: 0.12em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace; padding-bottom: 8px;">1日ごと</div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 10px; height: 44px; border-bottom: 1px solid #172A55;">
          <div style="width: 62px; font-size: 11.5px; color: #7B93BF; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">{{row.date}}</div>
          <div style="width: 46px; font-size: 14px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: {{row.color}};">{{row.occurrence}}</div>
          <div style="flex-grow: 1; font-size: 12px; color: #7B93BF; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">{{row.duration}}</div>
          <div style="font-size: 11px; color: {{row.methodColor}};">{{row.method}}</div>
        </div>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { day: '土', date: '09.13', n: 7, min: 38, method: 'チャレンジ' },
      { day: '金', date: '09.12', n: 3, min: 14, method: 'チャレンジ' },
      { day: '木', date: '09.11', n: 11, min: 52, method: '長押し' },
      { day: '水', date: '09.10', n: 4, min: 18, method: 'チャレンジ' },
      { day: '火', date: '09.09', n: 6, min: 27, method: 'チャレンジ' },
      { day: '月', date: '09.08', n: 5, min: 21, method: '長押し' },
      { day: '日', date: '09.07', n: null, min: null, method: '起きられず' },
    ];
    const ordered = data.slice().reverse();
    const bars = ordered.map((d) => ({
      h: d.n === null ? '2px' : Math.round((d.n / 12) * 84) + 'px',
      color: d.n === null ? '#55709E' : (d.n >= 9 ? '#FEE48F' : '#8CDDC2'),
      day: d.day,
      value: d.n === null ? '–' : String(d.n),
    }));
    const rows = data.map((d) => ({
      date: d.day + ' ' + d.date,
      occurrence: d.n === null ? '–' : d.n + '回目',
      duration: d.min === null ? '' : d.min + '分',
      color: d.n === null ? '#55709E' : (d.n >= 9 ? '#FEE48F' : '#E8EEF9'),
      method: d.method,
      methodColor: d.method === '長押し' ? '#FEE48F' : (d.method === '起きられず' ? '#55709E' : '#55709E'),
    }));
    return { bars, rows };
  }
}
</script>
</body>
</html>
