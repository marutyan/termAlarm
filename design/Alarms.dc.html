<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; display: flex;">
  <div style="width: 54px; flex-shrink: 0; border-right: 1px solid #1E3163; display: flex; flex-direction: column; align-items: center; padding: 78px 0 26px; gap: 22px;">
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg></div>
    <div style="width: 34px; height: 34px; border-radius: 3px; background: #8CDDC2; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1530" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-2.5 7-2.5 9h17C20.5 15 18 15 18 8z"/><path d="M10.2 20.5a2 2 0 003.6 0"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M6.5 2c0 5 5.5 6 5.5 10s-5.5 5-5.5 10M17.5 2c0 5-5.5 6-5.5 10s5.5 5 5.5 10"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2h5M19.4 6.2l1.4-1.4"/></svg></div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 74px 18px 0; display: flex; flex-direction: column; gap: 14px;">

    <div style="font-size: 28px; font-weight: 300; letter-spacing: -0.01em;">アラーム</div>
    <div style="font-size: 12.5px; color: #8AA0C9; line-height: 1.6; margin-top: -6px;">鳴動は1回です。</div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px;">

      <sc-for list="{{alarms}}" as="alarm" hint-placeholder-count="3">
        <div style="background: #142449; border-radius: 14px; padding: 15px 16px; display: flex; align-items: center; gap: 14px;">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: baseline; gap: 10px;">
              <div style="font-size: 32px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.04em; color: {{alarm.timeColor}};">{{alarm.time}}</div>
              <div style="font-size: 13px; color: #8AA0C9;">{{alarm.label}}</div>
            </div>
            <div style="font-size: 12px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">{{alarm.days}}</div>
          </div>
          <div style="width: 44px; height: 26px; border-radius: 13px; background: {{alarm.switchBg}}; display: flex; align-items: center; justify-content: {{alarm.switchAlign}}; padding: 3px; box-sizing: border-box;">
            <div style="width: 20px; height: 20px; border-radius: 50%; background: {{alarm.knob}};"></div>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; border: 1px dashed #27407C; border-radius: 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <div style="font-size: 14px; color: #8AA0C9;">アラームを追加</div>
      </div>

    </div>

    <div style="flex-grow: 1;"></div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { time: '12:30', label: '昼寝から戻る', days: 'きょうだけ', on: true },
      { time: '18:00', label: '', days: '月 火 水 木 金', on: true },
      { time: '6:00', label: 'ゴミの日', days: '火 金', on: false },
    ];
    const alarms = data.map((d) => ({
      time: d.time,
      label: d.label,
      days: d.days,
      timeColor: d.on ? '#E8EEF9' : '#8AA0C9',
      switchBg: d.on ? '#8CDDC2' : '#27407C',
      switchAlign: d.on ? 'flex-end' : 'flex-start',
      knob: d.on ? '#0B1530' : '#8AA0C9',
    }));
    return { alarms };
  }
}
</script>
</body>
</html>
