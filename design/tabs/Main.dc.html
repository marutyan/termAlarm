<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+JP:wght@100..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Google Sans Flex', 'Noto Sans JP', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D0BCFF; } a:hover { color: #EADDFF; }
  </style>
</helmet>
<div style="width: 412px; height: 917px; background: #141218; color: #E6E0E9; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 12px 8px 24px;">
    <div style="font-size: 32px; font-weight: 500; letter-spacing: -0.3px; line-height: 1.1;">時計</div>
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#CAC4D0">
        <circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle>
      </svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; flex-grow: 1; padding: 0 24px;">

    <svg width="300" height="300" viewBox="0 0 300 300" style="flex-shrink: 0;">
      <circle cx="150" cy="150" r="142" fill="none" stroke="#211F26" stroke-width="2"></circle>
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="60">
        <line x1="{{ t.x1 }}" y1="{{ t.y1 }}" x2="{{ t.x2 }}" y2="{{ t.y2 }}" stroke="{{ t.color }}" stroke-width="{{ t.width }}" stroke-linecap="round"></line>
      </sc-for>
      <sc-for list="{{numerals}}" as="n" hint-placeholder-count="4">
        <text x="{{ n.x }}" y="{{ n.y }}" fill="#CAC4D0" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">{{ n.label }}</text>
      </sc-for>
      <line x1="150" y1="150" x2="{{ hour.x }}" y2="{{ hour.y }}" stroke="#E6E0E9" stroke-width="8" stroke-linecap="round"></line>
      <line x1="150" y1="150" x2="{{ minute.x }}" y2="{{ minute.y }}" stroke="#E6E0E9" stroke-width="5" stroke-linecap="round"></line>
      <line x1="150" y1="150" x2="{{ second.x }}" y2="{{ second.y }}" stroke="#D0BCFF" stroke-width="2.5" stroke-linecap="round"></line>
      <circle cx="150" cy="150" r="7" fill="#D0BCFF"></circle>
    </svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="font-size: 20px; color: #CAC4D0; font-feature-settings: 'tnum';">9月3日（木）</div>
    </div>

    <div style="display: flex; background: #211F26; border-radius: 24px; padding: 4px; gap: 4px;">
      <div style="height: 48px; padding: 0 28px; border-radius: 20px; background: #4A4458; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8DEF8" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 1.9"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 600; color: #E8DEF8;">アナログ</span>
      </div>
      <div style="height: 48px; padding: 0 28px; border-radius: 20px; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M8 10v4"></path><path d="M12 10v4"></path><path d="M16 10v4"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 500; color: #CAC4D0;">デジタル</span>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: flex-start; justify-content: space-around; background: #211F26; padding: 12px 8px 24px; gap: 4px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M4.2 5.2 6.8 3"></path><path d="M19.8 5.2 17.2 3"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">アラーム</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; border-radius: 16px; background: #4A4458; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8DEF8" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 1.8"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #E6E0E9;">時計</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <path d="M8 3h8"></path><path d="M8 21h8"></path><path d="M9 3v3.5L12 10l3-3.5V3"></path><path d="M9 21v-3.5L12 14l3 3.5V21"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">タイマー</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="13.5" r="7.5"></circle><line x1="9.5" y1="3" x2="14.5" y2="3"></line><path d="M12 13.5V10"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">ストップ<br>ウォッチ</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":412,"height":917}}'>
// アナログ時計の目盛りと針の座標を計算する。10時9分35秒を指す状態を描く。
// SVGは12時が上、時計回りなので、角度から -90 度回して座標へ直す。
class Component extends DCLogic {
  renderVals() {
    const C = 150, R = 142;
    const at = (angleDeg, radius) => {
      const a = (angleDeg - 90) * Math.PI / 180;
      return { x: C + radius * Math.cos(a), y: C + radius * Math.sin(a) };
    };
    // 60本の目盛り。5分ごとは太く長くして、文字盤として読めるようにする
    const ticks = [];
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      const outer = at(i * 6, R - 6);
      const inner = at(i * 6, R - (major ? 20 : 12));
      ticks.push({
        x1: outer.x.toFixed(2), y1: outer.y.toFixed(2),
        x2: inner.x.toFixed(2), y2: inner.y.toFixed(2),
        color: major ? '#CAC4D0' : '#48454E',
        width: major ? 3 : 1.5,
      });
    }
    // 12/3/6/9 だけ数字を置く。全部入れると小さい画面で潰れる
    const numerals = [12, 3, 6, 9].map((n) => {
      const p = at(n * 30, R - 40);
      return { label: String(n), x: p.x.toFixed(2), y: p.y.toFixed(2) };
    });
    const h = 10, m = 9, s = 35;
    return {
      ticks,
      numerals,
      hour: at((h % 12) * 30 + m * 0.5, R * 0.52),
      minute: at(m * 6 + s * 0.1, R * 0.74),
      second: at(s * 6, R * 0.82),
    };
  }
}
</script>
</body>
</html>
