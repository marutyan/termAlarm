<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+JP:wght@100..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Google Sans Flex', 'Noto Sans JP', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D0BCFF; } a:hover { color: #EADDFF; }
  </style>
</helmet>
<div style="width: 412px; height: 917px; background: #141218; color: #E6E0E9; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 52px 16px 8px;">
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E6E0E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12,19 5,12 12,5"></polyline>
      </svg>
    </div>
    <span style="font-size: 22px; font-weight: 500;">設定</span>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; padding-bottom: 24px;">

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column;">
        <div style="padding: 24px 24px 8px;">
          <span style="font-size: 14px; font-weight: 600; color: #D0BCFF;">{{ sec.title }}</span>
        </div>

        <sc-for list="{{sec.items}}" as="it" hint-placeholder-count="7">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; min-height: 56px; box-sizing: border-box;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 16px; color: #E6E0E9;">{{ it.label }}</span>
              <sc-if value="{{ it.hasValue }}" hint-placeholder-val="{{ true }}">
                <span style="font-size: 14px; color: #938F99;">{{ it.value }}</span>
              </sc-if>
            </div>

            <sc-if value="{{ it.isToggleOn }}" hint-placeholder-val="{{ false }}">
              <div style="width: 52px; height: 32px; border-radius: 16px; background: #D0BCFF; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px; box-sizing: border-box; flex-shrink: 0;">
                <div style="width: 24px; height: 24px; border-radius: 12px; background: #381E72;"></div>
              </div>
            </sc-if>
            <sc-if value="{{ it.isToggleOff }}" hint-placeholder-val="{{ false }}">
              <div style="width: 52px; height: 32px; border-radius: 16px; background: #48454E; border: 2px solid #938F99; box-sizing: border-box; display: flex; align-items: center; padding: 0 5px; flex-shrink: 0;">
                <div style="width: 16px; height: 16px; border-radius: 8px; background: #938F99;"></div>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <sc-if value="{{ sec.hasSlider }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 16px; padding: 12px 24px 20px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0;">
              <circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M4.2 5.2 6.8 3"></path><path d="M19.8 5.2 17.2 3"></path>
            </svg>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
              <span style="font-size: 14px; color: #CAC4D0;">アラームの音量</span>
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="flex-grow: 1; height: 16px; border-radius: 8px; background: #D0BCFF;"></div>
                <div style="width: 4px; height: 32px; border-radius: 2px; background: #D0BCFF;"></div>
              </div>
            </div>
          </div>
        </sc-if>

        <div style="height: 1px; background: #2B2930; margin: 8px 24px 0;"></div>
      </div>
    </sc-for>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":412,"height":917}}'>
// 純正の設定画面で確認した13項目を、アラーム／時計／タイマーの3つに分けて並べる。
// 各項目は「値を持つもの」「切り替えのもの」のどちらかで、テンプレート側の分岐用に真偽値へ展開する。
class Component extends DCLogic {
  renderVals() {
    // value を持つ項目と、オン・オフの切り替え項目を同じ形へ揃える
    const row = (label, value, toggle) => ({
      label,
      value: value || '',
      hasValue: !!value,
      isToggleOn: toggle === true,
      isToggleOff: toggle === false,
    });
    return {
      sections: [
        {
          title: 'アラーム',
          hasSlider: true,
          items: [
            row('アラーム解除の操作', 'タップ'),
            row('消音までの時間', '10分'),
            row('スヌーズの長さ', '5分'),
            row('徐々に音量を上げる', '5秒'),
            row('アラーム時の音量ボタン', '音量の調整'),
            row('週の始まり', '日曜日'),
          ],
        },
        {
          title: '時計',
          hasSlider: false,
          items: [
            row('スタイル', 'アナログ'),
            row('時刻に秒を表示', null, true),
            row('日付と時刻の変更', null),
          ],
        },
        {
          title: 'タイマー',
          hasSlider: false,
          items: [
            row('タイマーの音', 'タイマー完了'),
            row('徐々に音量を上げる', 'なし'),
            row('タイマーのバイブレーション', null, true),
          ],
        },
      ],
    };
  }
}
</script>
</body>
</html>
