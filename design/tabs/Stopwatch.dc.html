<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+JP:wght@100..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Google Sans Flex', 'Noto Sans JP', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D0BCFF; } a:hover { color: #EADDFF; }
  </style>
</helmet>
<div style="width: 412px; height: 917px; background: #141218; color: #E6E0E9; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 12px 8px 24px;">
    <div style="font-size: 32px; font-weight: 500; letter-spacing: -0.3px; line-height: 1.1;">ストップウォッチ</div>
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#CAC4D0">
        <circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle>
      </svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; padding: 40px 0 32px;">
    <span style="font-size: 76px; font-weight: 400; line-height: 1; letter-spacing: -2px; font-feature-settings: 'tnum';">00:15.75</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 13px;">
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 4px;">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #2B2930; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="14,6 8,12 14,18"></polyline>
        </svg>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #2B2930; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="10,6 16,12 10,18"></polyline>
        </svg>
      </div>
    </div>

    <div style="display: flex; gap: 10px; overflow: hidden;">
      <sc-for list="{{laps}}" as="lap" hint-placeholder-count="4">
        <div style="flex-shrink: 0; width: 88px; border: 1px solid #48454E; border-radius: 20px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 15px; color: #CAC4D0;">{{ lap.no }}</span>
          <span style="font-size: 15px; color: #E6E0E9; font-feature-settings: 'tnum';">{{ lap.split }}</span>
          <span style="font-size: 14px; color: #938F99; font-feature-settings: 'tnum';">{{ lap.total }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 32px 13px 0; flex-grow: 1;">
    <div style="height: 104px; border-radius: 52px; background: #FFB4AB; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 22px; font-weight: 600; color: #690005;">停止</span>
    </div>
    <div style="height: 104px; border-radius: 52px; background: #211F26; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 22px; font-weight: 500; color: #E6E0E9;">リセット</span>
    </div>
    <div style="height: 104px; border-radius: 52px; background: #2B2930; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 22px; font-weight: 500; color: #E6E0E9;">ラップ</span>
    </div>
  </div>

  <div style="display: flex; align-items: flex-start; justify-content: space-around; background: #211F26; padding: 12px 8px 24px; gap: 4px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M4.2 5.2 6.8 3"></path><path d="M19.8 5.2 17.2 3"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">アラーム</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 1.8"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">時計</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <path d="M8 3h8"></path><path d="M8 21h8"></path><path d="M9 3v3.5L12 10l3-3.5V3"></path><path d="M9 21v-3.5L12 14l3 3.5V21"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">タイマー</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; border-radius: 16px; background: #4A4458; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8DEF8" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="13.5" r="7.5"></circle><line x1="9.5" y1="3" x2="14.5" y2="3"></line><path d="M12 13.5V10"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #E6E0E9;">ストップ<br>ウォッチ</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":412,"height":917}}'>
// ラップは横に並べて古い順に流す。純正と同じく、周回数・そのラップの時間・その時点の合計を縦に3行で出す。
class Component extends DCLogic {
  renderVals() {
    return {
      laps: [
        { no: '19', split: '00:00.23', total: '00:15.18' },
        { no: '20', split: '00:00.21', total: '00:15.39' },
        { no: '21', split: '00:00.23', total: '00:15.63' },
        { no: '22', split: '00:00.12', total: '00:15.75' },
      ],
    };
  }
}
</script>
</body>
</html>
