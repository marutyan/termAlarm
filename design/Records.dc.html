<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1530; color: #E8EEF9; box-sizing: border-box; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 74px 20px 0; box-sizing: content-box;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <img src="app_icon.png" style="width: 26px; height: 26px; border-radius: 7px;">
      <div style="font-size: 13.5px; color: #E8EEF9; letter-spacing: 0.01em;">TermAlarm</div>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#8AA0C9"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></div>
  </div>


  <div style="flex-grow: 1; box-sizing: border-box; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 14px;">

    <div style="font-size: 28px; font-weight: 300; letter-spacing: -0.01em;">記録</div>

    <div style="display: flex; gap: 6px;">
      <div style="flex-grow: 1; height: 42px; display: flex; align-items: center; justify-content: center; background: #123A3C; border: 1px solid #2E5A57; border-radius: 3px; font-size: 13px; color: #8CDDC2;">今週</div>
      <div style="flex-grow: 1; height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid #1E3163; border-radius: 3px; font-size: 13px; color: #8AA0C9;">直近30日</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;">
      <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 11px; letter-spacing: 0.1em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">平均</div>
        <div style="font-size: 25px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">6.5</div>
        <div style="font-size: 11px; color: #8AA0C9;">回目で起床</div>
      </div>
      <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 11px; letter-spacing: 0.1em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">平均</div>
        <div style="font-size: 25px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">30<span style="font-size: 12px; color: #8AA0C9;">分</span></div>
        <div style="font-size: 11px; color: #8AA0C9;">開始から</div>
      </div>
      <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 11px; letter-spacing: 0.1em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">放置</div>
        <div style="font-size: 25px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; color: #FEE48F;">31<span style="font-size: 12px; color: #8AA0C9;">%</span></div>
        <div style="font-size: 11px; color: #8AA0C9;">止めずに終わった回</div>
      </div>
    </div>

    <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 14px 15px 12px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 11px; letter-spacing: 0.12em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">何回目で起きたか</div>
        <div style="font-size: 11px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">09.07 – 09.13</div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 7px; height: 88px;">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="7">
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div style="font-size: 11px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">{{bar.value}}</div>
            <div style="width: 100%; height: {{bar.h}}; background: {{bar.color}}; border: {{bar.border}}; box-sizing: border-box; border-radius: 1px;"></div>
            <div style="font-size: 11px; color: {{bar.dayColor}}; font-family: 'IBM Plex Mono', monospace;">{{bar.day}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 11px; letter-spacing: 0.12em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-bottom: 8px;">1日ごと</div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px; height: 46px; border-bottom: 1px solid #172A55;">
          <div style="width: 64px; font-size: 12px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">{{row.date}}</div>
          <div style="width: 52px; font-size: 14px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: {{row.color}};">{{row.occurrence}}</div>
          <div style="flex-grow: 1; font-size: 12.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">{{row.duration}}</div>
          <div style="font-size: 11.5px; color: {{row.methodColor}};">{{row.method}}</div>
        </div>
      </sc-for>
    </div>

  </div>
  <div style="border-top: 1px solid #1E3163; display: flex; padding: 6px 4px 22px;">
    <div style="flex: 1 1 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg>
      <div style="font-size: 11px; color: #8AA0C9;">ターム</div>
    </div>
    <div style="flex: 1 1 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-2.5 7-2.5 9h17C20.5 15 18 15 18 8z"/><path d="M10.2 20.5a2 2 0 003.6 0"/></svg>
      <div style="font-size: 11px; color: #8AA0C9;">アラーム</div>
    </div>
    <div style="flex: 1 1 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8CDDC2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      <div style="font-size: 11px; color: #8CDDC2;">記録</div>
    </div>
    <div style="flex: 1 1 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M6.5 2c0 5 5.5 6 5.5 10s-5.5 5-5.5 10M17.5 2c0 5-5.5 6-5.5 10s5.5 5 5.5 10"/></svg>
      <div style="font-size: 11px; color: #8AA0C9;">タイマー</div>
    </div>
    <div style="flex: 1 1 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2h5M19.4 6.2l1.4-1.4"/></svg>
      <div style="font-size: 11px; color: #8AA0C9;">ストップ</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 週は月曜から始める。今日は金曜で、土日はまだ来ていない
    const week = [
      { day: '月', date: '09.07', n: 5, min: 21, method: '長押し', state: 'done' },
      { day: '火', date: '09.08', n: 6, min: 27, method: '正解', state: 'done' },
      { day: '水', date: '09.09', n: 4, min: 18, method: '正解', state: 'done' },
      { day: '木', date: '09.10', n: 11, min: 52, method: '長押し', state: 'done' },
      { day: '金', date: '09.11', n: null, min: null, method: '', state: 'today' },
      { day: '土', date: '09.12', n: null, min: null, method: '', state: 'future' },
      { day: '日', date: '09.13', n: null, min: null, method: '', state: 'future' },
    ];
    const bars = week.map((d) => {
      if (d.state === 'done') {
        return {
          h: Math.round((d.n / 12) * 88) + 'px',
          color: d.n >= 9 ? '#FEE48F' : '#8CDDC2',
          border: 'none',
          day: d.day,
          dayColor: '#8AA0C9',
          value: String(d.n),
        };
      }
      if (d.state === 'today') {
        return { h: '26px', color: 'transparent', border: '1px dashed #2E5A57', day: d.day, dayColor: '#8CDDC2', value: '…' };
      }
      return { h: '2px', color: '#1E3163', border: 'none', day: d.day, dayColor: '#8AA0C9', value: '' };
    });

    const rows = [
      { date: '09.11 金', occurrence: '進行中', duration: '4回目が鳴っている', color: '#8CDDC2', method: '', methodColor: '#8AA0C9' },
      { date: '09.10 木', occurrence: '11回目', duration: '52分', color: '#FEE48F', method: '長押し', methodColor: '#FEE48F' },
      { date: '09.09 水', occurrence: '4回目', duration: '18分', color: '#E8EEF9', method: '正解', methodColor: '#8AA0C9' },
      { date: '09.08 火', occurrence: '6回目', duration: '27分', color: '#E8EEF9', method: '正解', methodColor: '#8AA0C9' },
      { date: '09.07 月', occurrence: '5回目', duration: '21分', color: '#E8EEF9', method: '長押し', methodColor: '#FEE48F' },
    ];
    return { bars, rows };
  }
}
</script>
</body>
</html>
