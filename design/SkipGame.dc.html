<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+JP:wght@100..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Google Sans Flex', 'Noto Sans JP', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
  </style>
</helmet>
<div style="width: 412px; height: 917px; background: #FEF7FF; color: #1D1B20; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 52px 16px 8px;">
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </div>
    <span style="font-size: 22px; font-weight: 500;">今日はもう止める</span>
  </div>

  <div style="background: #E8DEF8; border-radius: 20px; margin: 8px 16px 0; padding: 16px 18px; display: flex; align-items: flex-start; gap: 12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D192B" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px;">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path>
    </svg>
    <div style="font-size: 14px; color: #1D192B; line-height: 1.6;">正解すると、<strong style="font-weight: 700;">7:00–9:00 の残り23回</strong>を今日は鳴らしません</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; flex-grow: 1; padding: 0 24px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="height: 32px; padding: 0 16px; border-radius: 16px; background: #F3EDF7; display: flex; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: #49454F;">計算</span>
      </div>
      <div style="font-size: 56px; font-weight: 500; letter-spacing: -1.5px; line-height: 1.2; font-feature-settings: 'tnum';">47 + 68</div>
    </div>

    <div style="width: 100%; height: 72px; border-radius: 24px; border: 2px solid #6750A4; background: #FFFFFF; display: flex; align-items: center; padding: 0 24px; box-sizing: border-box;">
      <span style="font-size: 32px; font-weight: 500; color: #1D1B20; font-feature-settings: 'tnum';">115</span>
      <div style="width: 2px; height: 36px; background: #6750A4; margin-left: 2px;"></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%;">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <div style="height: 64px; border-radius: 20px; background: #F3EDF7; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 26px; font-weight: 500; color: #1D1B20; font-feature-settings: 'tnum';">{{ k.label }}</span>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px 32px;">
    <div style="height: 56px; border-radius: 28px; background: #6750A4; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">決定</span>
    </div>
    <div style="height: 48px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 600; color: #49454F;">やめる</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":412,"height":917}}'>
// 当日終了の前に出すゲームの一例（計算問題）。実際は6種類からランダムに1種類が選ばれる。
// テンキーは3列グリッドに並べるため、ラベルだけの単純な配列として渡す。
class Component extends DCLogic {
  renderVals() {
    return {
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '←', '0', '✓'].map((label) => ({ label })),
    };
  }
}
</script>
</body>
</html>
