<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #1A1B22; color: #E8EEF9; box-sizing: border-box; padding: 78px 18px 0; display: flex; flex-direction: column; gap: 26px;">

  <div style="font-size: 11px; letter-spacing: 0.15em; color: #7E8496; font-family: 'IBM Plex Mono', monospace; padding-left: 4px;">大きいほう · 横4つぶん</div>

  <div style="background: #0B1530; border-radius: 22px; padding: 20px 22px; display: flex; align-items: center; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; gap: 5px;">
        <div style="font-size: 52px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 0.9; letter-spacing: -0.05em;">7:12</div>
        <div style="font-size: 22px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #8AA0C9;">44</div>
      </div>
      <div style="font-size: 12.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-left: 4px;">09.11 金</div>
    </div>
    <div style="width: 1px; align-self: stretch; background: #1E3163;"></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
      <div style="font-size: 11px; letter-spacing: 0.13em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">つぎ</div>
      <div style="font-size: 30px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; color: #8CDDC2;">7:15</div>
      <div style="font-size: 12px; color: #8AA0C9;">あと22回</div>
    </div>
  </div>

  <div style="font-size: 11px; letter-spacing: 0.15em; color: #7E8496; font-family: 'IBM Plex Mono', monospace; padding-left: 4px;">小さいほう · 横2つぶん</div>

  <div style="display: flex; gap: 16px;">
    <div style="width: 166px; background: #0B1530; border-radius: 22px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 40px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 0.9; letter-spacing: -0.05em;">7:12</div>
      <div style="font-size: 11.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">09.11 金</div>
      <div style="height: 4px;"></div>
      <div style="display: flex; align-items: baseline; gap: 7px;">
        <div style="font-size: 20px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #8CDDC2; line-height: 1;">7:15</div>
        <div style="font-size: 11.5px; color: #8AA0C9;">あと22回</div>
      </div>
    </div>

    <div style="width: 166px; background: #0B1530; border-radius: 22px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; border: 2px solid #8CDDC2;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #8CDDC2;"></div>
        <div style="font-size: 11px; letter-spacing: 0.13em; color: #8CDDC2; font-family: 'IBM Plex Mono', monospace;">鳴っています</div>
      </div>
      <div style="font-size: 40px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 0.9; letter-spacing: -0.05em; color: #8CDDC2;">7:15</div>
      <div style="height: 4px;"></div>
      <div style="font-size: 11.5px; color: #8AA0C9;">4回目 / 25回</div>
      <div style="display: flex; align-items: center; gap: 2px;">
        <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
          <div style="flex-grow: 1; height: 8px; background: {{slot.color}};"></div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="font-size: 12px; color: #7E8496; line-height: 1.7; padding-bottom: 30px;">ホーム画面に置く時計。次に鳴る時刻と、その時間帯にあと何回鳴るかを一緒に出す。<br>鳴っている間は輪郭と色で分かるようにする。</div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#2E5A57' : (now ? '#8CDDC2' : '#16274F') });
    }
    return { slots };
  }
}
</script>
</body>
</html>
