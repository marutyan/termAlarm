<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; padding: 62px 20px 0; display: flex; flex-direction: column;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 10px; letter-spacing: 0.16em; color: #8CDDC2; font-family: 'IBM Plex Mono', monospace; padding-left: 10px;">4回目 / 25回</div>
      <div style="font-size: 86px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 0.88; letter-spacing: -0.055em;">7:15</div>
      <div style="font-size: 13px; color: #7B93BF; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; padding-left: 10px;">7:00 – 9:00 · 5分ごと</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding-top: 8px;">
      <div style="font-size: 9px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">音量</div>
      <div style="display: flex; align-items: flex-end; gap: 2px; height: 26px;">
        <div style="width: 4px; height: 9px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 13px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 17px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 21px; background: #27407C;"></div>
        <div style="width: 4px; height: 26px; background: #27407C;"></div>
      </div>
    </div>
  </div>

  <div style="height: 18px;"></div>

  <div style="display: flex; align-items: center; gap: 2px;">
    <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
      <div style="flex-grow: 1; height: 12px; background: {{slot.color}};"></div>
    </sc-for>
  </div>

  <div style="height: 6px;"></div>
  <div style="font-size: 12px; color: #55709E;">9:00まで あと21回</div>

  <div style="height: 30px;"></div>

  <div style="display: flex; flex-direction: column; gap: 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 12px; color: #A9C0E4;">1から12まで順に押す</div>
      <div style="font-size: 11px; color: #8CDDC2; font-family: 'IBM Plex Mono', monospace;">3 / 12</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="12">
        <div style="height: 78px; display: flex; align-items: center; justify-content: center; background: {{tile.bg}}; border: 1px solid {{tile.border}}; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; color: {{tile.fg}};">{{tile.n}}</div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 11px; height: 56px; padding: 0 16px; border: 1px solid #27407C; border-radius: 3px; margin-bottom: 28px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7B93BF" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5"/></svg>
    <div style="font-size: 12.5px; color: #7B93BF;">3秒長押しで今回だけ止める</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 10px; color: #55709E; font-family: 'IBM Plex Mono', monospace;">記録に残る</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#2E5A57' : (now ? '#8CDDC2' : '#16274F') });
    }
    const order = [7, 2, 11, 5, 1, 9, 4, 12, 3, 6, 10, 8];
    const tiles = order.map((n) => {
      const pressed = n <= 3;
      return {
        n: n,
        bg: pressed ? '#123A3C' : '#0B1530',
        border: pressed ? '#2E5A57' : '#27407C',
        fg: pressed ? '#2E5A57' : '#E8EEF9',
      };
    });
    return { slots, tiles };
  }
}
</script>
</body>
</html>
