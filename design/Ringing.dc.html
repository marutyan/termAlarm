<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; padding: 62px 20px 0; display: flex; flex-direction: column;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 11px; letter-spacing: 0.16em; color: #8CDDC2; font-family: 'IBM Plex Mono', monospace;">4回目 / 25回</div>
      <div style="font-size: 86px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 0.88; letter-spacing: -0.055em;">7:15</div>
      <div style="font-size: 13px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">7:00 – 9:00 · 5分ごと</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding-top: 8px;">
      <div style="font-size: 11px; letter-spacing: 0.1em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">音量</div>
      <div style="display: flex; align-items: flex-end; gap: 2px; height: 26px;">
        <div style="width: 4px; height: 9px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 13px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 17px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 21px; background: #27407C;"></div>
        <div style="width: 4px; height: 26px; background: #27407C;"></div>
      </div>
    </div>
  </div>

  <div style="height: 18px;"></div>

  <div style="display: flex; align-items: center; gap: 2px;">
    <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
      <div style="flex-grow: 1; height: 12px; background: {{slot.color}};"></div>
    </sc-for>
  </div>

  <div style="height: 6px;"></div>
  <div style="font-size: 12.5px; color: #8AA0C9;">9:00まで 残り21回</div>


  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 30px;">

    <div style="background: #8CDDC2; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1530" stroke-width="2.2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 18px; font-weight: 500; color: #0B1530;">ストップ</div>
        <div style="font-size: 12.5px; color: #14493F;">次は 7:20</div>
      </div>
    </div>

    <div style="border: 1px solid #27407C; border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7"/></svg>
      <div style="flex-grow: 1; font-size: 15px; color: #A9C0E4;">タームを終了</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#2E5A57' : (now ? '#8CDDC2' : '#16274F') });
    }
    return { slots };
  }
}
</script>
</body>
</html>
