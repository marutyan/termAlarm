<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #060C1C; color: #E8EEF9; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 26px;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 74px 20px 0; opacity: 0.13; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 28px; font-weight: 300;">設定</div>
    <div style="height: 14px;"></div>
    <div style="font-size: 11px; letter-spacing: 0.15em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">アラーム</div>
    <div style="background: #142449; border-radius: 14px; height: 290px;"></div>
  </div>

  <div style="position: relative; width: 100%; background: #16274F; border-radius: 20px; box-sizing: border-box; padding: 22px 0 8px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 22px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h3l4 3V9l-4 3H3z"/><path d="M15 10l5 5M20 10l-5 5"/></svg>
      <div style="font-size: 18px; font-weight: 400;">消音までの時間</div>
    </div>

    <div style="font-size: 12.5px; color: #A9C0E4; line-height: 1.6; padding: 0 22px 14px;">放っておいたときに自動で止まるまでの時間。<br>「なし」なら止めるまで鳴り続けます。</div>

    <sc-for list="{{options}}" as="opt" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 15px; height: 54px; padding: 0 22px;">
        <div style="width: 22px; height: 22px; border-radius: 50%; border: {{opt.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background: {{opt.dot}};"></div>
        </div>
        <div style="flex-grow: 1; font-size: 15px; color: {{opt.fg}};">{{opt.label}}</div>
      </div>
    </sc-for>

    <div style="display: flex; justify-content: flex-end; padding: 10px 14px 8px;">
      <div style="height: 44px; padding: 0 22px; display: flex; align-items: center; justify-content: center; border-radius: 22px; font-size: 14.5px; color: #8CDDC2;">キャンセル</div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['なし', '1分', '5分', '10分', '15分'];
    const selected = 'なし';
    const options = labels.map((l) => ({
      label: l,
      ring: l === selected ? '6px solid #8CDDC2' : '2px solid #3C5484',
      dot: l === selected ? '#16274F' : 'transparent',
      fg: l === selected ? '#E8EEF9' : '#A9C0E4',
    }));
    return { options };
  }
}
</script>
</body>
</html>
