<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #060C1C; color: #E8EEF9; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 74px 20px 0; opacity: 0.22;">
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <div style="font-size: 78px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; line-height: 0.9;">7:12</div>
      <div style="font-size: 33px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #8AA0C9;">44</div>
    </div>
    <div style="height: 7px;"></div>
    <div style="font-size: 14.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-left: 9px;">09.11 金</div>
  </div>

  <div style="background: #0B1530; border-radius: 22px 22px 0 0; box-sizing: border-box; padding: 12px 20px 26px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
      <div style="width: 38px; height: 4px; border-radius: 2px; background: #27407C;"></div>
      <div style="width: 44px;"></div>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; letter-spacing: 0.14em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">はじめ</div>
        <div style="font-size: 42px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.04em; border-bottom: 2px solid #8CDDC2; padding-bottom: 5px;">7:00</div>
      </div>
      <div style="font-size: 22px; color: #8AA0C9; padding-bottom: 9px;">–</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; letter-spacing: 0.14em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">おわり</div>
        <div style="font-size: 42px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.04em; border-bottom: 2px solid #1E3163; padding-bottom: 5px;">9:00</div>
      </div>
    </div>

    <div style="display: flex; gap: 5px;">
      <sc-for list="{{days}}" as="day" hint-placeholder-count="7">
        <div style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13.5px; background: {{day.bg}}; border: 1px solid {{day.border}}; box-sizing: border-box; color: {{day.fg}};">{{day.name}}</div>
      </sc-for>
    </div>

    <div style="height: 1px; background: #1E3163;"></div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 62px; font-size: 13px; color: #A9C0E4;">間隔</div>
        <div style="flex-grow: 1; display: flex; gap: 6px;">
          <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1E3163; border-radius: 3px; font-size: 13.5px; color: #8AA0C9;">等間隔</div>
          <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #2E5A57; background: #123A3C; border-radius: 3px; font-size: 13.5px; color: #8CDDC2;">加速</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding-left: 74px;">
        <div style="display: flex; align-items: baseline; gap: 5px; padding: 5px 11px 6px; border: 1px solid #1E3163; border-radius: 3px;">
          <div style="font-size: 23px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">10<span style="font-size: 12px; color: #8AA0C9;">分</span></div>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
        </div>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M14 7l5 5-5 5"/></svg>
        <div style="display: flex; align-items: baseline; gap: 5px; padding: 5px 11px 6px; border: 1px solid #1E3163; border-radius: 3px;">
          <div style="font-size: 23px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">3<span style="font-size: 12px; color: #8AA0C9;">分</span></div>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
        </div>
      </div>
      <div style="font-size: 11.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; padding-left: 74px;">7:00, 7:10, 7:19 … 7:58, 8:00 · 全11回</div>
    </div>

    <div style="height: 1px; background: #1E3163;"></div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 62px; font-size: 13px; color: #A9C0E4;">問題の出題</div>
        <div style="flex-grow: 1; display: flex; gap: 6px;">
          <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1E3163; border-radius: 3px; font-size: 13.5px; color: #8AA0C9;">なし</div>
          <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1E3163; border-radius: 3px; font-size: 13.5px; color: #8AA0C9;">Easy</div>
          <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #2E5A57; background: #123A3C; border-radius: 3px; font-size: 13.5px; color: #8CDDC2;">Hard</div>
        </div>
      </div>
      <div style="font-size: 11.5px; color: #8AA0C9; padding-left: 74px;">Hardは終わりに近づくほど問題数が増えます</div>
    </div>

    <div style="height: 1px; background: #1E3163;"></div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <div style="flex-grow: 1; font-size: 14px; color: #E8EEF9;">二度寝チェック</div>
        <div style="width: 44px; height: 26px; border-radius: 13px; background: #8CDDC2; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box;">
          <div style="width: 20px; height: 20px; border-radius: 50%; background: #0B1530;"></div>
        </div>
      </div>
      <div style="font-size: 11.5px; color: #8AA0C9;">ターム終了の5分後に再度鳴動します</div>
    </div>

    <div style="height: 1px; background: #1E3163;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 46px;">
      <div style="width: 62px; font-size: 13px; color: #A9C0E4;">名前</div>
      <div style="flex-grow: 1; font-size: 14px; color: #8AA0C9;">つけなくてよい</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div style="display: flex; gap: 8px;">
      <div style="width: 108px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid #27407C; border-radius: 3px; font-size: 13.5px; color: #A9C0E4;">削除</div>
      <div style="flex-grow: 1; height: 50px; display: flex; align-items: center; justify-content: center; background: #8CDDC2; border-radius: 3px; font-size: 15px; font-weight: 500; color: #0B1530;">保存</div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['月', '火', '水', '木', '金', '土', '日'];
    const on = [true, true, true, true, true, true, false];
    const days = names.map((n, i) => ({
      name: n,
      bg: on[i] ? '#8CDDC2' : 'transparent',
      border: on[i] ? '#8CDDC2' : '#1E3163',
      fg: on[i] ? '#0B1530' : '#8AA0C9',
    }));
    return { days };
  }
}
</script>
</body>
</html>
