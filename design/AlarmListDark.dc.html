<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=Noto+Sans+JP:wght@100..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Google Sans Flex', 'Noto Sans JP', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D0BCFF; } a:hover { color: #D0BCFF; }
  </style>
</helmet>
<div style="position: relative; width: 412px; height: 917px; background: #141218; color: #E6E0E9; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 12px 8px 24px;">
    <div style="font-size: 36px; font-weight: 500; letter-spacing: -0.4px; line-height: 1.1;">アラーム</div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle><line x1="16.2" y1="16.2" x2="21" y2="21"></line>
        </svg>
      </div>
      <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#CAC4D0">
          <circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle>
        </svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0; flex-grow: 1;">
    <sc-for list="{{alarms}}" as="a" hint-placeholder-count="3">
      <div style="background: #211F26; border-radius: 28px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <sc-if value="{{ a.isRange }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: baseline; gap: 8px;">
                <span style="font-size: 40px; font-weight: 500; line-height: 1; letter-spacing: -1px;">{{ a.start }}</span>
                <span style="font-size: 22px; font-weight: 300; color: #CAC4D0; line-height: 1;">–</span>
                <span style="font-size: 40px; font-weight: 500; line-height: 1; letter-spacing: -1px;">{{ a.end }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ a.isSingle }}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 40px; font-weight: 500; line-height: 1; letter-spacing: -1px;">{{ a.start }}</div>
            </sc-if>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #CAC4D0; line-height: 1.4;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D0BCFF" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 1.8"></path>
              </svg>
              <span>{{ a.summary }}</span>
            </div>
          </div>
          <sc-if value="{{ a.enabled }}" hint-placeholder-val="{{ true }}">
            <div style="width: 52px; height: 32px; border-radius: 16px; background: #D0BCFF; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px; box-sizing: border-box; flex-shrink: 0;">
              <div style="width: 24px; height: 24px; border-radius: 12px; background: #381E72;"></div>
            </div>
          </sc-if>
          <sc-if value="{{ a.disabled }}" hint-placeholder-val="{{ false }}">
            <div style="width: 52px; height: 32px; border-radius: 16px; background: #48454E; border: 2px solid #938F99; box-sizing: border-box; display: flex; align-items: center; padding: 0 5px; flex-shrink: 0;">
              <div style="width: 16px; height: 16px; border-radius: 8px; background: #938F99;"></div>
            </div>
          </sc-if>
        </div>
        <div style="display: flex; gap: 6px;">
          <sc-for list="{{a.days}}" as="d" hint-placeholder-count="7">
            <sc-if value="{{ d.on }}" hint-placeholder-val="{{ true }}">
              <div style="width: 32px; height: 32px; border-radius: 16px; background: #D0BCFF; color: #381E72; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{ d.label }}</div>
            </sc-if>
            <sc-if value="{{ d.off }}" hint-placeholder-val="{{ false }}">
              <div style="width: 32px; height: 32px; border-radius: 16px; background: transparent; color: #938F99; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center;">{{ d.label }}</div>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; right: 20px; bottom: 108px; width: 72px; height: 72px; border-radius: 24px; background: #4F378B; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#EADDFF" stroke-width="2.2" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </div>

  <div style="display: flex; align-items: flex-start; justify-content: space-around; background: #211F26; padding: 12px 8px 24px; gap: 4px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; border-radius: 16px; background: #4A4458; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8DEF8" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M4.2 5.2 6.8 3"></path><path d="M19.8 5.2 17.2 3"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #E6E0E9;">アラーム</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 1.8"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">時計</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="13.5" r="7.5"></circle><line x1="9.5" y1="3" x2="14.5" y2="3"></line><line x1="12" y1="3" x2="12" y2="6"></line><path d="M12 9.5v4"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">タイマー</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
      <div style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="13.5" r="7.5"></circle><line x1="9.5" y1="3" x2="14.5" y2="3"></line><path d="M12 13.5 15.5 10"></path><path d="M18.5 7 20 8.5"></path>
        </svg>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #CAC4D0;">ストップ<br>ウォッチ</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":412,"height":917}}'>
// アラーム一覧の表示用データ。範囲指定と単発指定の両方の見え方を確認するため、
// 意図的に3件目を開始と終了が同じ「単発アラーム」にしている。
class Component extends DCLogic {
  renderVals() {
    const week = ['月', '火', '水', '木', '金', '土', '日'];
    // 曜日チップの選択状態を、テンプレート側で分岐しやすい形へ展開する
    const days = (onIndexes) => week.map((label, i) => ({
      label,
      on: onIndexes.includes(i),
      off: !onIndexes.includes(i),
    }));
    const raw = [
      { start: '7:00', end: '9:00', summary: '5分ごと · 25回', enabled: true, dayIdx: [0, 1, 2, 3, 4] },
      { start: '12:30', end: '13:00', summary: '10分ごと · 4回', enabled: true, dayIdx: [0, 1, 2, 3, 4, 5, 6] },
      { start: '22:00', end: '22:00', summary: '1回のみ', enabled: false, dayIdx: [5, 6] },
    ];
    return {
      alarms: raw.map((a) => ({
        ...a,
        isRange: a.start !== a.end,
        isSingle: a.start === a.end,
        disabled: !a.enabled,
        days: days(a.dayIdx),
      })),
    };
  }
}
</script>
</body>
</html>
