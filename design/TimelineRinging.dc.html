<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', system-ui, sans-serif; }
    a { color: #F2A65A; } a:hover { color: #FFC489; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0E14; color: #E8E4DC; box-sizing: border-box; padding: 64px 28px 0; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 11px; letter-spacing: 0.16em; color: #F2A65A;">4回目 / 25回</div>
    <div style="font-size: 76px; font-weight: 300; line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">7:15</div>
    <div style="font-size: 13.5px; color: #8A8F9C;">起きる・9:00まで あと21回</div>
  </div>

  <div style="height: 44px;"></div>

  <div style="display: flex; flex-direction: column; gap: 18px;">
    <div style="font-size: 11px; letter-spacing: 0.16em; color: #5E6472;">とめるには</div>
    <div style="display: flex; align-items: baseline; gap: 14px; font-variant-numeric: tabular-nums;">
      <div style="font-size: 44px; font-weight: 400; letter-spacing: -0.01em;">47 + 68</div>
      <div style="font-size: 26px; color: #5E6472;">=</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #F2A65A; padding-bottom: 10px;">
      <div style="font-size: 38px; font-weight: 400; font-variant-numeric: tabular-nums; color: #E8E4DC;">11</div>
      <div style="width: 2px; height: 34px; background: #F2A65A;"></div>
    </div>
  </div>

  <div style="height: 26px;"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">1</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">2</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">3</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">4</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">5</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">6</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">7</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">8</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">9</div>
    <div style="padding: 18px 0; text-align: center; font-size: 20px; border: 1px solid #222833; border-radius: 4px; color: #5E6472;">消す</div>
    <div style="padding: 18px 0; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; border: 1px solid #222833; border-radius: 4px;">0</div>
    <div style="padding: 18px 0; display: flex; align-items: center; justify-content: center; background: #F2A65A; border-radius: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0E14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 26px;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <sc-for list="{{ticks}}" as="tick" hint-placeholder-count="25">
        <div style="flex-grow: 1; height: {{tick.h}}; background: {{tick.color}}; border-radius: 1px;"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #5E6472; font-variant-numeric: tabular-nums;">
      <div>7:00</div>
      <div>9:00</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 9px; padding: 15px; border: 1px solid #222833; border-radius: 4px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5E6472" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5"/></svg>
      <div style="font-size: 12.5px; color: #5E6472;">3秒長押しで今回だけ止める</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ticks = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      ticks.push({
        h: now ? '22px' : '10px',
        color: done ? '#4A3722' : (now ? '#F2A65A' : '#1C222D'),
      });
    }
    return { ticks };
  }
}
</script>
</body>
</html>
