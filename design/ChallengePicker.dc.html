<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #060C1C; color: #E8EEF9; box-sizing: border-box; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; flex-direction: column;">


  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 74px 20px 0; opacity: 0.2;">
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <div style="font-size: 78px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; line-height: 0.9;">7:12</div>
      <div style="font-size: 33px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #8AA0C9;">44</div>
    </div>
    <div style="height: 7px;"></div>
    <div style="font-size: 14.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-left: 9px;">09.11 金</div>
  </div>

  <div style="background: #0B1530; border-radius: 24px 24px 0 0; box-sizing: border-box; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; justify-content: center;">
      <div style="width: 38px; height: 4px; border-radius: 2px; background: #27407C;"></div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: baseline; gap: 9px;">
        <div style="font-size: 40px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.04em;">7:00</div>
        <div style="font-size: 20px; color: #8AA0C9;">–</div>
        <div style="font-size: 40px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.04em;">9:00</div>
      </div>
      <div style="width: 44px; height: 26px; border-radius: 13px; background: #8CDDC2; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box;">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: #0B1530;"></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between;">
      <sc-for list="{{days}}" as="day" hint-placeholder-count="7">
        <div style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; background: {{day.bg}}; border: 1px solid {{day.border}}; box-sizing: border-box; color: {{day.fg}};">{{day.name}}</div>
      </sc-for>
    </div>

    <div style="background: #142449; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; border-bottom: 1px solid #0B1530;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0l-7.2-7.2A2 2 0 013 12V5a2 2 0 012-2h7a2 2 0 011.4.6l7.2 7.2a2 2 0 010 2.6z"/><circle cx="7.8" cy="7.8" r="1.3" fill="#8AA0C9" stroke="none"/></svg>
        <div style="flex-grow: 1; font-size: 15px;">ラベル</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; border-bottom: 1px solid #0B1530;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round"><path d="M4 6v12M10 6v12M15 6v12M19 6v12"/></svg>
        <div style="flex-grow: 1; font-size: 15px;">間隔</div>
        <div style="font-size: 14px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">加速 10→3分</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.9.6c0 1.6-2.4 2-2.4 3.6"/><circle cx="12" cy="17" r="0.9" fill="#8AA0C9" stroke="none"/></svg>
        <div style="flex-grow: 1; font-size: 15px;">問題</div>
        <div style="font-size: 14px; color: #8AA0C9;">Hard</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div style="background: #142449; border-radius: 14px; display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 11a9 9 0 113 7.5"/><path d="M3 5v5h5"/><path d="M12 8.5V12l2.6 1.8"/></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 15px;">二度寝チェック</div>
        <div style="font-size: 11.5px; color: #8AA0C9;">ターム終了の5分後に再度鳴動</div>
      </div>
      <div style="width: 44px; height: 26px; border-radius: 13px; background: #8CDDC2; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box;">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: #0B1530;"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 2px;">
      <div style="height: 52px; padding: 0 28px; display: flex; align-items: center; justify-content: center; background: #142449; border-radius: 26px; font-size: 14.5px; color: #A9C0E4;">削除</div>
      <div style="height: 52px; padding: 0 36px; display: flex; align-items: center; justify-content: center; background: #8CDDC2; border-radius: 26px; font-size: 15px; font-weight: 500; color: #0B1530;">保存</div>
    </div>

  </div>

  </div>

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(3, 7, 18, 0.74);"></div>

  <div style="position: absolute; left: 26px; right: 26px; top: 50%; transform: translateY(-50%);">
    <div style="background: #16274F; border-radius: 20px; box-sizing: border-box; padding: 22px 0 12px; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 22px 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.9.6c0 1.6-2.4 2-2.4 3.6"/><circle cx="12" cy="17" r="0.9" fill="#8AA0C9" stroke="none"/></svg>
        <div style="font-size: 18px; font-weight: 400;">問題</div>
      </div>

      <sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
        <div style="display: flex; align-items: flex-start; gap: 15px; padding: 9px 22px;">
          <div style="width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; border-radius: 50%; border: {{opt.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
            <div style="width: 10px; height: 10px; border-radius: 50%; background: {{opt.dot}};"></div>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <div style="font-size: 15px; color: {{opt.fg}};">{{opt.label}}</div>
            <div style="font-size: 11.5px; color: #8AA0C9; line-height: 1.5;">{{opt.note}}</div>
          </div>
        </div>
      </sc-for>

      <div style="height: 1px; background: #27407C; margin: 14px 22px 16px;"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 0 22px;">
        <div style="flex-grow: 1; font-size: 14px; color: #A9C0E4;">難易度</div>
        <div style="display: flex; gap: 7px;">
          <div style="width: 84px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3C5484; border-radius: 10px; font-size: 14px; color: #A9C0E4;">Easy</div>
          <div style="width: 84px; height: 44px; display: flex; align-items: center; justify-content: center; background: #123A3C; border: 1px solid #8CDDC2; box-sizing: border-box; border-radius: 10px; font-size: 14px; color: #8CDDC2;">Hard</div>
        </div>
      </div>
      <div style="font-size: 11.5px; color: #8AA0C9; padding: 9px 22px 0;">Hardは終わりに近づくほど問題数が増えます</div>

      <div style="display: flex; justify-content: flex-end; padding: 12px 14px 8px;">
        <div style="height: 44px; padding: 0 22px; display: flex; align-items: center; justify-content: center; border-radius: 22px; font-size: 14.5px; color: #8CDDC2;">キャンセル</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { label: '出さない', note: '押すだけで止まります' },
      { label: 'ターム終了時だけ', note: '最後の1回だけ問題を出します。途中は押すだけで止まります' },
      { label: '毎回', note: '鳴るたびに問題を出します' },
    ];
    const selected = '毎回';
    const options = data.map((d) => ({
      label: d.label,
      note: d.note,
      ring: d.label === selected ? '6px solid #8CDDC2' : '2px solid #3C5484',
      dot: d.label === selected ? '#16274F' : 'transparent',
      fg: d.label === selected ? '#E8EEF9' : '#A9C0E4',
    }));
    return { options };
  }
}
</script>
</body>
</html>
