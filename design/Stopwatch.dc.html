<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; display: flex;">
  <div style="width: 54px; flex-shrink: 0; border-right: 1px solid #1E3163; display: flex; flex-direction: column; align-items: center; padding: 78px 0 26px; gap: 22px;">
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-2.5 7-2.5 9h17C20.5 15 18 15 18 8z"/><path d="M10.2 20.5a2 2 0 003.6 0"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M6.5 2c0 5 5.5 6 5.5 10s-5.5 5-5.5 10M17.5 2c0 5-5.5 6-5.5 10s5.5 5 5.5 10"/></svg></div>
    <div style="width: 34px; height: 34px; border-radius: 3px; background: #8CDDC2; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1530" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2h5M19.4 6.2l1.4-1.4"/></svg></div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></div>
  </div>
  <div style="flex-grow: 1; box-sizing: border-box; padding: 74px 18px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="font-size: 28px; font-weight: 300; letter-spacing: -0.01em;">ストップウォッチ</div>

    <div style="display: flex; align-items: baseline; gap: 4px;">
      <div style="font-size: 66px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.05em;">0:42</div>
      <div style="font-size: 34px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #8CDDC2; line-height: 1;">.18</div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1 1 0; height: 56px; display: flex; align-items: center; justify-content: center; background: #142449; border-radius: 28px; font-size: 15px; color: #A9C0E4;">リセット</div>
      <div style="flex: 1 1 0; height: 56px; display: flex; align-items: center; justify-content: center; background: #142449; border-radius: 28px; font-size: 15px; color: #A9C0E4;">ラップ</div>
      <div style="flex: 1 1 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 7px; background: #8CDDC2; border-radius: 28px; font-size: 15px; font-weight: 500; color: #0B1530;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B1530" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
        停止
      </div>
    </div>

    <div style="background: #142449; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
      <sc-for list="{{laps}}" as="lap" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px; border-bottom: {{lap.border}};">
          <div style="width: 34px; font-size: 13px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">{{lap.no}}</div>
          <div style="flex-grow: 1; font-size: 16px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: {{lap.fg}};">{{lap.split}}</div>
          <div style="font-size: 13px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">{{lap.total}}</div>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1;"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { no: '4', split: '0:09.42', total: '0:42.18' },
      { no: '3', split: '0:11.08', total: '0:32.76' },
      { no: '2', split: '0:10.51', total: '0:21.68' },
      { no: '1', split: '0:11.17', total: '0:11.17' },
    ];
    const fastest = '0:09.42';
    const laps = data.map((d, i) => ({
      no: d.no,
      split: d.split,
      total: d.total,
      fg: d.split === fastest ? '#8CDDC2' : '#E8EEF9',
      border: i === data.length - 1 ? 'none' : '1px solid #0B1530',
    }));
    return { laps };
  }
}
</script>
</body>
</html>
