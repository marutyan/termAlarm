<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #A3E635; } a:hover { color: #BEF264; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0A0A; color: #E5E5E5; box-sizing: border-box; display: flex;">

  <div style="width: 54px; flex-shrink: 0; border-right: 1px solid #1F1F1F; display: flex; flex-direction: column; align-items: center; padding: 78px 0 26px; gap: 22px;">
    <div style="width: 34px; height: 34px; border-radius: 3px; background: #A3E635; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-2.5 7-2.5 9h17C20.5 15 18 15 18 8z"/><path d="M10.2 20.5a2 2 0 003.6 0"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M6.5 2c0 5 5.5 6 5.5 10s-5.5 5-5.5 10M17.5 2c0 5-5.5 6-5.5 10s5.5 5 5.5 10"/></svg></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2h5M19.4 6.2l1.4-1.4"/></svg></div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 74px 18px 0; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: baseline; gap: 7px;">
      <div style="font-size: 78px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; line-height: 0.9;">7:12</div>
      <div style="font-size: 33px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; color: #858585;">44</div>
    </div>
    <div style="height: 7px;"></div>
    <div style="font-size: 14.5px; color: #858585; font-family: 'IBM Plex Mono', monospace; padding-left: 9px;">09.11 金</div>

    <div style="height: 34px;"></div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; letter-spacing: 0.15em; color: #858585; font-family: 'IBM Plex Mono', monospace;">次の鳴動</div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="font-size: 44px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.035em; color: #A3E635;">7:15</div>
        <div style="font-size: 13px; color: #858585;">残り22回</div>
      </div>
      <div style="font-size: 13.5px; color: #A3A3A3; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">7:00 – 9:00 · 5分ごと</div>
      <div style="height: 4px;"></div>
      <div style="display: flex; align-items: center; gap: 2px;">
        <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
          <div style="flex-grow: 1; height: 12px; background: {{slot.color}};"></div>
        </sc-for>
      </div>
    </div>


    <div style="height: 12px;"></div>

    <div style="display: flex; align-items: center; gap: 9px; height: 44px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7"/></svg>
      <div style="font-size: 13.5px; color: #858585;">このタームを終了</div>
    </div>

    <div style="height: 14px;"></div>

    <div style="font-size: 11px; letter-spacing: 0.15em; color: #858585; font-family: 'IBM Plex Mono', monospace; padding-bottom: 11px;">ターム</div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 26px;">

      <sc-for list="{{terms}}" as="term" hint-placeholder-count="2">
        <div style="display: flex; align-items: stretch; gap: 12px; padding: 14px 14px 14px 0; background: #111111; border: 1px solid #1F1F1F; border-radius: 3px;">
          <div style="width: 4px; background: {{term.accent}}; border-radius: 0 2px 2px 0;"></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px;">
            <div style="font-size: 19px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: {{term.timeColor}}; line-height: 1;">{{term.range}}</div>
            <div style="display: flex; gap: 5px;">
              <sc-for list="{{term.days}}" as="day" hint-placeholder-count="7">
                <div style="width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; background: {{day.bg}}; color: {{day.fg}};">{{day.name}}</div>
              </sc-for>
            </div>
            <div style="font-size: 12px; color: #858585;">{{term.detail}}</div>
          </div>
          <div style="display: flex; align-items: center; padding-left: 4px;">
            <div style="width: 40px; height: 24px; border-radius: 12px; background: {{term.switchBg}}; display: flex; align-items: center; justify-content: {{term.switchAlign}}; padding: 3px; box-sizing: border-box;">
              <div style="width: 18px; height: 18px; border-radius: 50%; background: {{term.knob}};"></div>
            </div>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 1px dashed #262626; border-radius: 3px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <div style="font-size: 13px; color: #858585;">タームを追加</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#3F4A1C' : (now ? '#A3E635' : '#1C1C1C') });
    }
    const names = ['月', '火', '水', '木', '金', '土', '日'];
    const makeDays = (on, enabled) => names.map((n, i) => ({
      name: n,
      bg: on[i] ? (enabled ? '#A3E635' : '#858585') : 'transparent',
      fg: on[i] ? (enabled ? '#0A0A0A' : '#A3A3A3') : '#858585',
    }));
    const terms = [
      {
        range: '7:00 – 9:00',
        detail: '5分ごと · 25回',
        days: makeDays([true, true, true, true, true, true, false], true),
        accent: '#A3E635',
        timeColor: '#E5E5E5',
        switchBg: '#A3E635',
        switchAlign: 'flex-end',
        knob: '#0A0A0A',
      },
      {
        range: '9:30 – 10:00',
        detail: '10分ごと · 4回',
        days: makeDays([false, false, false, false, false, false, true], false),
        accent: '#262626',
        timeColor: '#858585',
        switchBg: '#262626',
        switchAlign: 'flex-start',
        knob: '#858585',
      },
    ];
    return { slots, terms };
  }
}
</script>
</body>
</html>
