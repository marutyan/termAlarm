<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9.5px; letter-spacing: 0.16em; color: #8CDDC2; font-family: 'IBM Plex Mono', monospace;">RINGING · 04 / 25</div>
      <div style="font-size: 78px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 0.88; letter-spacing: -0.05em;">7:15</div>
      <div style="font-size: 12px; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">7:00 – 9:00 · 5分ごと</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 6px;">
      <div style="font-size: 8.5px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">音量</div>
      <div style="display: flex; align-items: flex-end; gap: 2px; height: 24px;">
        <div style="width: 4px; height: 8px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 12px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 16px; background: #8CDDC2;"></div>
        <div style="width: 4px; height: 20px; background: #27407C;"></div>
        <div style="width: 4px; height: 24px; background: #27407C;"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 2px;">
    <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
      <div style="flex-grow: 1; height: 10px; background: {{slot.color}};"></div>
    </sc-for>
  </div>

  <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 16px 15px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 9.5px; letter-spacing: 0.13em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">1から12まで順に押す</div>
      <div style="font-size: 9.5px; color: #8CDDC2; font-family: 'IBM Plex Mono', monospace;">3 / 12</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
      <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="12">
        <div style="aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: {{tile.bg}}; border: 1px solid {{tile.border}}; border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-variant-numeric: tabular-nums; color: {{tile.fg}};">{{tile.n}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px;">
    <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 11px 13px; display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 8.5px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">きょう</div>
      <div style="font-size: 12.5px; color: #A9C0E4; line-height: 1.45;">4回目<br><span style="color: #55709E; font-size: 10.5px;">いつもは6.2回目</span></div>
    </div>
    <div style="background: #142449; border: 1px solid #1E3163; border-radius: 3px; padding: 11px 13px; display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 8.5px; letter-spacing: 0.1em; color: #7B93BF; font-family: 'IBM Plex Mono', monospace;">のこり</div>
      <div style="font-size: 12.5px; color: #A9C0E4; line-height: 1.45;">21回 / 1時間45分<br><span style="color: #55709E; font-size: 10.5px;">9:00まで</span></div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 15px; border: 1px solid #27407C; border-radius: 3px; margin-bottom: 26px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7B93BF" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5"/></svg>
    <div style="font-size: 11.5px; color: #7B93BF;">3秒長押しで今回だけ止める</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 9.5px; color: #55709E; font-family: 'IBM Plex Mono', monospace;">記録に残る</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#2E5A57' : (now ? '#8CDDC2' : '#16274F') });
    }
    const order = [7, 2, 11, 5, 1, 9, 4, 12, 3, 6, 10, 8];
    const tiles = order.map((n) => {
      const pressed = n <= 3;
      return {
        n: n,
        bg: pressed ? '#123A3C' : '#0B1530',
        border: pressed ? '#2E5A57' : '#27407C',
        fg: pressed ? '#2E5A57' : '#E8EEF9',
      };
    });
    return { slots, tiles };
  }
}
</script>
</body>
</html>
