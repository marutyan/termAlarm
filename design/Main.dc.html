<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1530; color: #E8EEF9; box-sizing: border-box; display: flex;">

  <div style="width: 54px; flex-shrink: 0; border-right: 1px solid #1E3163; display: flex; flex-direction: column; align-items: center; padding: 78px 0 26px; gap: 26px;">
    <div style="width: 34px; height: 34px; border-radius: 3px; background: #8CDDC2; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1530" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round"><path d="M12 13V8M9 3h6M5 13a7 7 0 1014 0 7 7 0 00-14 0z"/></svg>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19h-20"/></svg>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 74px 18px 0; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: baseline; gap: 7px;">
      <div style="font-size: 78px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; line-height: 0.9;">7:12</div>
      <div style="font-size: 33px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; color: #8AA0C9;">44</div>
    </div>
    <div style="height: 7px;"></div>
    <div style="font-size: 14.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-left: 9px;">09.11 金</div>

    <div style="height: 34px;"></div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; letter-spacing: 0.15em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">つぎに鳴るのは</div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="font-size: 44px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.035em; color: #8CDDC2;">7:15</div>
        <div style="font-size: 13px; color: #8AA0C9;">あと22回</div>
      </div>
      <div style="font-size: 13.5px; color: #A9C0E4; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">7:00 – 9:00 · 5分ごと</div>
      <div style="height: 4px;"></div>
      <div style="display: flex; align-items: center; gap: 2px;">
        <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
          <div style="flex-grow: 1; height: 12px; background: {{slot.color}};"></div>
        </sc-for>
      </div>
    </div>


    <div style="height: 12px;"></div>

    <div style="display: flex; align-items: center; gap: 9px; height: 44px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7"/></svg>
      <div style="font-size: 13.5px; color: #8AA0C9;">今日はもう止める</div>
    </div>

    <div style="height: 14px;"></div>

    <div style="font-size: 11px; letter-spacing: 0.15em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-bottom: 11px;">ターム</div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 26px;">

      <sc-for list="{{terms}}" as="term" hint-placeholder-count="2">
        <div style="display: flex; align-items: stretch; gap: 12px; padding: 14px 14px 14px 0; background: #142449; border: 1px solid #1E3163; border-radius: 3px;">
          <div style="width: 4px; background: {{term.accent}}; border-radius: 0 2px 2px 0;"></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px;">
            <div style="font-size: 19px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: {{term.timeColor}}; line-height: 1;">{{term.range}}</div>
            <div style="display: flex; gap: 5px;">
              <sc-for list="{{term.days}}" as="day" hint-placeholder-count="7">
                <div style="width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; background: {{day.bg}}; color: {{day.fg}};">{{day.name}}</div>
              </sc-for>
            </div>
            <div style="font-size: 12px; color: #8AA0C9;">{{term.detail}}</div>
          </div>
          <div style="display: flex; align-items: center; padding-left: 4px;">
            <div style="width: 40px; height: 24px; border-radius: 12px; background: {{term.switchBg}}; display: flex; align-items: center; justify-content: {{term.switchAlign}}; padding: 3px; box-sizing: border-box;">
              <div style="width: 18px; height: 18px; border-radius: 50%; background: {{term.knob}};"></div>
            </div>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 1px dashed #27407C; border-radius: 3px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <div style="font-size: 13px; color: #8AA0C9;">タームを追加</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#2E5A57' : (now ? '#8CDDC2' : '#16274F') });
    }
    const names = ['月', '火', '水', '木', '金', '土', '日'];
    const makeDays = (on, enabled) => names.map((n, i) => ({
      name: n,
      bg: on[i] ? (enabled ? '#8CDDC2' : '#8AA0C9') : 'transparent',
      fg: on[i] ? (enabled ? '#0B1530' : '#A9C0E4') : '#8AA0C9',
    }));
    const terms = [
      {
        range: '7:00 – 9:00',
        detail: '5分ごと · 25回',
        days: makeDays([true, true, true, true, true, true, false], true),
        accent: '#8CDDC2',
        timeColor: '#E8EEF9',
        switchBg: '#8CDDC2',
        switchAlign: 'flex-end',
        knob: '#0B1530',
      },
      {
        range: '9:30 – 10:00',
        detail: '10分ごと · 4回',
        days: makeDays([false, false, false, false, false, false, true], false),
        accent: '#27407C',
        timeColor: '#8AA0C9',
        switchBg: '#27407C',
        switchAlign: 'flex-start',
        knob: '#8AA0C9',
      },
    ];
    return { slots, terms };
  }
}
</script>
</body>
</html>
