<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #8CDDC2; } a:hover { color: #A9D1F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #060C1C; color: #E8EEF9; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 74px 20px 0; opacity: 0.15;">
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <div style="font-size: 78px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; line-height: 0.9;">7:12</div>
      <div style="font-size: 33px; font-weight: 200; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #8AA0C9;">44</div>
    </div>
    <div style="height: 7px;"></div>
    <div style="font-size: 14.5px; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace; padding-left: 9px;">09.11 金</div>
  </div>

  <div style="background: #0B1530; border-radius: 24px 24px 0 0; box-sizing: border-box; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; justify-content: center;">
      <div style="width: 38px; height: 4px; border-radius: 2px; background: #27407C;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.7" stroke-linecap="round"><path d="M4 6v12M10 6v12M15 6v12M19 6v12"/></svg>
      <div style="font-size: 19px; font-weight: 400;">間隔</div>
    </div>

    <div style="display: flex; gap: 8px;">
      <div style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; background: #142449; border-radius: 12px; font-size: 15px; color: #8AA0C9;">等間隔</div>
      <div style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; background: #123A3C; border: 1px solid #8CDDC2; box-sizing: border-box; border-radius: 12px; font-size: 15px; color: #8CDDC2;">加速</div>
    </div>

    <div style="background: #142449; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 11px; letter-spacing: 0.14em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">開始</div>
          <div style="display: flex; align-items: baseline; gap: 6px; padding: 5px 12px 6px; background: #123A3C; border: 1px solid #8CDDC2; border-radius: 8px;">
            <div style="font-size: 26px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; color: #8CDDC2;">10<span style="font-size: 13px; color: #8AA0C9;">分</span></div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8CDDC2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 15l-7-7-7 7"/></svg>
          </div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><path d="M4 12h15M14 7l5 5-5 5"/></svg>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
          <div style="font-size: 11px; letter-spacing: 0.14em; color: #8AA0C9; font-family: 'IBM Plex Mono', monospace;">終了</div>
          <div style="display: flex; align-items: baseline; gap: 6px; padding: 5px 12px 6px; border: 1px solid #1E3163; border-radius: 8px;">
            <div style="font-size: 26px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">3<span style="font-size: 13px; color: #8AA0C9;">分</span></div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8AA0C9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between;">
        <sc-for list="{{chips}}" as="chip" hint-placeholder-count="6">
          <div style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: {{chip.bg}}; border: 1px solid {{chip.border}}; box-sizing: border-box; border-radius: 10px; font-size: 15px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: {{chip.fg}};">{{chip.label}}</div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px; padding: 0 4px;">
      <div style="font-size: 13px; color: #A9C0E4; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1.6;">7:00, 7:10, 7:19, 7:27, 7:34,<br>7:40, 7:45 … 8:00</div>
      <div style="font-size: 11.5px; color: #8AA0C9;">全11回。終了時刻には必ず鳴動します</div>
    </div>

    <div style="height: 52px; display: flex; align-items: center; justify-content: center; background: #8CDDC2; border-radius: 26px; font-size: 15px; font-weight: 500; color: #0B1530;">決定</div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 間隔によく使う分数。末尾の「他」から任意の分数も選べる
    const values = [1, 3, 5, 10, 15];
    const chips = values.map((v) => ({
      label: String(v),
      bg: v === 10 ? '#8CDDC2' : 'transparent',
      border: v === 10 ? '#8CDDC2' : '#1E3163',
      fg: v === 10 ? '#0B1530' : '#A9C0E4',
    }));
    chips.push({ label: '他', bg: 'transparent', border: '#1E3163', fg: '#8AA0C9' });
    return { chips };
  }
}
</script>
</body>
</html>
