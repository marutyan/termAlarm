<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #A3E635; } a:hover { color: #BEF264; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0A0A; color: #E5E5E5; box-sizing: border-box; display: flex;">

  <div style="width: 56px; flex-shrink: 0; border-right: 1px solid #1F1F1F; display: flex; flex-direction: column; align-items: center; padding: 60px 0 26px; gap: 30px;">
    <div style="width: 34px; height: 34px; border-radius: 3px; background: #A3E635; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/></svg>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.6" stroke-linecap="round"><path d="M12 13V8M9 3h6M5 13a7 7 0 1014 0 7 7 0 00-14 0z"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.6" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19h-20"/></svg>
    <div style="flex-grow: 1;"></div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 01-4 0v-.1A1.6 1.6 0 007 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H1a2 2 0 010-4h.1A1.6 1.6 0 004.6 7a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V1a2 2 0 014 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H23a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 56px 18px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 30px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;">7:12:44</div>
      <div style="font-size: 11px; color: #737373; font-family: 'IBM Plex Mono', monospace;">土 09.13</div>
    </div>

    <div style="background: #111111; border: 1px solid #1F1F1F; border-radius: 3px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 10px; letter-spacing: 0.14em; color: #A3E635; font-family: 'IBM Plex Mono', monospace;">RINGING SOON</div>
        <div style="font-size: 10px; color: #737373; font-family: 'IBM Plex Mono', monospace;">04 / 25</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="font-size: 46px; font-weight: 300; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.03em;">7:15</div>
        <div style="font-size: 13px; color: #A3A3A3;">起きる</div>
      </div>
      <div style="display: flex; align-items: center; gap: 2px;">
        <sc-for list="{{slots}}" as="slot" hint-placeholder-count="25">
          <div style="flex-grow: 1; height: 16px; background: {{slot.color}};"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #525252; font-family: 'IBM Plex Mono', monospace;">
        <div>7:00 · 5分ごと</div>
        <div>9:00 · あと22回</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="background: #111111; border: 1px solid #1F1F1F; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 9px; letter-spacing: 0.1em; color: #737373; font-family: 'IBM Plex Mono', monospace;">平均</div>
        <div style="font-size: 23px; font-weight: 400; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">6.2</div>
        <div style="font-size: 10px; color: #525252;">回目で起床</div>
      </div>
      <div style="background: #111111; border: 1px solid #1F1F1F; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 9px; letter-spacing: 0.1em; color: #737373; font-family: 'IBM Plex Mono', monospace;">平均</div>
        <div style="font-size: 23px; font-weight: 400; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1;">31<span style="font-size: 12px; color: #737373;">分</span></div>
        <div style="font-size: 10px; color: #525252;">開始から</div>
      </div>
      <div style="background: #111111; border: 1px solid #1F1F1F; border-radius: 3px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 9px; letter-spacing: 0.1em; color: #737373; font-family: 'IBM Plex Mono', monospace;">長押し</div>
        <div style="font-size: 23px; font-weight: 400; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; color: #F59E0B;">18<span style="font-size: 12px; color: #737373;">%</span></div>
        <div style="font-size: 10px; color: #525252;">で緊急停止</div>
      </div>
    </div>

    <div style="background: #111111; border: 1px solid #1F1F1F; border-radius: 3px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 10px; letter-spacing: 0.14em; color: #737373; font-family: 'IBM Plex Mono', monospace;">直近7日 何回目で起きたか</div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 7px; height: 76px;">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="7">
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div style="width: 100%; height: {{bar.h}}; background: {{bar.color}}; border-radius: 1px;"></div>
            <div style="font-size: 9px; color: #525252; font-family: 'IBM Plex Mono', monospace;">{{bar.day}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="display: flex; align-items: center; gap: 11px; padding: 12px 14px; background: #111111; border: 1px solid #1F1F1F; border-radius: 3px 3px 0 0;">
        <div style="width: 5px; height: 26px; background: #A3E635; border-radius: 1px;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 13.5px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;">7:00 – 9:00</div>
          <div style="font-size: 10.5px; color: #737373;">起きる · 5分 · 月火水木金土</div>
        </div>
        <div style="width: 32px; height: 18px; border-radius: 9px; background: #A3E635; display: flex; align-items: center; justify-content: flex-end; padding: 2px; box-sizing: border-box;">
          <div style="width: 14px; height: 14px; border-radius: 50%; background: #0A0A0A;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 12px 14px; background: #111111; border: 1px solid #1F1F1F; border-radius: 0 0 3px 3px;">
        <div style="width: 5px; height: 26px; background: #262626; border-radius: 1px;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 13.5px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: #737373;">9:30 – 10:00</div>
          <div style="font-size: 10.5px; color: #525252;">昼寝から戻る · 10分 · 日</div>
        </div>
        <div style="width: 32px; height: 18px; border-radius: 9px; background: #262626; display: flex; align-items: center; padding: 2px; box-sizing: border-box;">
          <div style="width: 14px; height: 14px; border-radius: 50%; background: #525252;"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const done = i < 3;
      const now = i === 3;
      slots.push({ color: done ? '#3F4A1C' : (now ? '#A3E635' : '#1C1C1C') });
    }
    const counts = [8, 5, 11, 4, 6, 3, 7];
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const bars = counts.map((c, i) => ({
      h: Math.round((c / 12) * 76) + 'px',
      color: c >= 9 ? '#F59E0B' : '#A3E635',
      day: days[i],
    }));
    return { slots, bars };
  }
}
</script>
</body>
</html>
